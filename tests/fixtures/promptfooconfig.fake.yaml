# Same eval as promptfooconfig.yaml, with offline fake providers. Used by tests/test_e2e.py,
# which writes tests.fake.json next to this file before running promptfoo.
description: Paper Radar offline e2e

prompts:
  - id: file://../../prompts/pick.j2
    label: pick
    config:
      response_format: file://../../prompts/answer_schema.json
  - id: file://../../prompts/trap.j2
    label: trap
  - id: file://../../prompts/tools.j2
    label: tools
    config:
      tools: file://../../prompts/tools.json
      tool_choice: auto

providers:
  - id: file://fake_provider.py
    label: fake-honest
    config:
      mode: honest
  - id: file://fake_provider.py
    label: fake-hallucinating
    config:
      mode: hallucinating

tests: file://tests.fake.json
